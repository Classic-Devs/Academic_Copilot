runtime: python312

# ─── Entrypoint ──────────────────────────────────────────────────────────────
# gthread workers let streaming chat responses run without blocking other
# requests. Tuned for F2 (2 vCPUs).
entrypoint: >
  gunicorn
  --bind 0.0.0.0:$PORT
  --worker-class gthread
  --workers 2
  --threads 8
  --timeout 120
  --log-level info
  academic_copilot.wsgi:application

instance_class: F2

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 16

# ─── Environment ─────────────────────────────────────────────────────────────
# App Engine's filesystem is read-only, so production REQUIRES:
#   • GS_BUCKET_NAME — a private GCS bucket (uniform bucket-level access) for uploads
#   • CHROMA_HOST    — a Chroma server (e.g. on Cloud Run / GCE) for the vector index
#   • DATABASE_URL   — Cloud SQL Postgres
# Secrets (SECRET_KEY, DATABASE_URL, GEMINI_API_KEY) belong in Secret Manager or
# the Cloud Console — never commit them here.
env_variables:
  DJANGO_SETTINGS_MODULE: "academic_copilot.settings"
  PYTHONUNBUFFERED: "1"
  DEBUG: "False"
  # Google's front end appends <client>, <load balancer> to X-Forwarded-For.
  TRUSTED_PROXY_COUNT: "2"
  # GS_BUCKET_NAME: "your-private-bucket"
  # CHROMA_HOST: "chroma.example.internal"
  # CHROMA_SSL: "True"
  # DATABASE_URL: "postgres://user:pass@/dbname?host=/cloudsql/project:region:instance"
  # CACHE_URL: "redis://10.0.0.3:6379/0"   # shared rate limits across instances

# ─── Handlers ────────────────────────────────────────────────────────────────
# Uploaded documents are private and served only through the app's
# permission-checked /documents/<id>/file/ view — there is no /media handler.
handlers:
  - url: /static
    static_dir: staticfiles
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"

  - url: /.*
    script: auto
    secure: always

# Run migrations and collectstatic in CI before `gcloud app deploy`:
#   python manage.py migrate --no-input && python manage.py collectstatic --no-input
#
# Re-process documents lost to instance recycling with a Cloud Scheduler job
# that runs:  python manage.py process_documents
